name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Game & APK
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install -g cordova
          cordova create app com.filko.ucanfil "Ucan Fil"
          rm -rf app/www/*
          cp -r dist/* app/www/
          cp icon.png app/icon.png
          sed -i 's/<\/widget>/    <icon src="icon.png" \/>\n<\/widget>/' app/config.xml
          cd app
          cordova platform add android
          cordova build android
      - name: Rename APK
        run: mv app/platforms/android/app/build/outputs/apk/debug/app-debug.apk UcanFil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UcanFil-APK
          path: UcanFil.apk
